name: Bug report
description: Something renders or builds incorrectly
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: newBrush version, placeholder: "e.g. 0.1.0" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: HTML + CSS (a CodePen/StackBlitz link is ideal) and the steps to reproduce.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and OS, placeholder: "e.g. Safari 18, macOS 15" }
